<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <picture>
        <source srcset="logo-dark.png" media="(prefers-color-scheme: dark)">
        <img src="logo.png" alt="EasySalon">
      </picture>
      <span class="wordmark">Hermes</span>
    </div>
    <nav class="nav" aria-label="Hovedmeny">
      <a class="nav-link active" href="#/dashboard">Oversikt</a>
    </nav>
    <div class="user">
      <span class="muted">{{ userEmail() }}</span>
      <button type="button" class="btn btn-light" (click)="logout()">Logg ut</button>
    </div>
  </div>
</header>

<main class="content">
  <div class="page-header">
    <h1>Oversikt</h1>
    <div class="page-actions">
      <span class="muted num">{{ today | date:'d. MMMM yyyy' }}</span>
      <button type="button" class="btn btn-light" (click)="refresh()" [disabled]="isLoading()">Oppdater</button>
    </div>
  </div>

  <section class="kpis">
    <div class="card kpi">
      <span class="eyebrow">Leads</span>
      <span class="kpi-value num">
        @if (leadsCount() === undefined) { … } @else { {{ leadsCount() | number:'1.0-0' }} }
      </span>
      <span class="muted">totalt i basen</span>
    </div>
  </section>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <section class="card next">
    <h2>Neste</h2>
    <p class="muted">Flere visninger kommer her: pipeline, kampanjer og kostnader.</p>
  </section>
</main>
