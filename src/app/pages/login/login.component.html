<main class="login-page">
  <aside class="brand-panel">
    <div class="brand-inner">
      <picture>
        <source srcset="logo-dark.png" media="(prefers-color-scheme: dark)">
        <img src="logo.png" alt="EasySalon" class="logo">
      </picture>
      <h1 class="wordmark">Salg</h1>
    </div>
  </aside>

  <section class="form-panel">
    <form class="form" [formGroup]="form" (ngSubmit)="submit()" autocomplete="on">
      <h2>Logg inn</h2>

      <label for="email">E-post</label>
      <input id="email" type="email" formControlName="email" autocomplete="username">

      <label for="password">Passord</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password">

      <button type="submit" class="btn btn-block" [disabled]="isLoggingIn()">
        {{ isLoggingIn() ? 'Logger inn...' : 'Logg inn' }}
      </button>

      <div class="error" role="alert">
        @if (form.touched && form.invalid) {
          Fyll inn e-post og passord.
        } @else {
          {{ loginError() }}
        }
      </div>
    </form>
  </section>
</main>
